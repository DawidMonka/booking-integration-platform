services:
  postgres:
    image: postgres:16
    container_name: booking-postgres
    environment:
      POSTGRES_DB: bookingdb
      POSTGRES_USER: bookinguser
      POSTGRES_PASSWORD: bookingpassword
    ports:
      - "5432:5432"
    volumes:
      - booking-postgres-data:/var/lib/postgresql/data

  booking-api:
    image: booking-api:local
    build:
      context: .
      dockerfile: src/Booking.api/Dockerfile
    container_name: booking-api
    ports:
      - "5223:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BookingDatabase: "Host=postgres;Port=5432;Database=bookingdb;Username=bookinguser;Password=bookingpassword"
    depends_on:
      - postgres

volumes:
  booking-postgres-data: