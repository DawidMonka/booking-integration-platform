services:
  postgres:
    image: postgres:16
    container_name: booking-postgres
    environment:
      POSTGRES_DB: bookingdb
      POSTGRES_USER: bookinguser
      POSTGRES_PASSWORD: bookingpassword
    ports:
      - "5432:5432"
    volumes:
      - booking-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookinguser -d bookingdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking-api:
    image: booking-api:local
    build:
      context: .
      dockerfile: src/Booking.api/Dockerfile
    container_name: booking-api
    ports:
      - "5223:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BookingDatabase: "Host=postgres;Port=5432;Database=bookingdb;Username=bookinguser;Password=bookingpassword"
      Kafka__BootstrapServers: "kafka:19092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  kafka:
    image: apache/kafka:4.2.2
    hostname: kafka
    container_name: booking-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.2.2
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic booking-created-v1 \
          --partitions 1 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic booking-created-v1.dlq \
          --partitions 1 \
          --replication-factor 1

  supplier-worker:
    image: supplier-integration-worker:local
    build:
      context: .
      dockerfile: src/SupplierIntegration.Worker/Dockerfile
    container_name: supplier-integration-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      Kafka__BootstrapServers: "kafka:19092"
      Kafka__GroupId: "supplier-integration"
      Kafka__DeadLetterTopic: "booking-created-v1.dlq"
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  booking-postgres-data: